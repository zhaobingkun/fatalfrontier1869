<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
<title id="title">Launcher error evidence capture guide</title><desc id="desc">Illustrated checklist, not a Paydirt Launcher screenshot. Keep the exact message, stage, time and version; redact personal, authentication, identity and payment information.</desc>
<rect width="900" height="440" fill="#090909"/>
<style>text{font-family:Arial,sans-serif;fill:#fffdf7}.title{font-size:30px;font-weight:700}.label{font-size:15px;letter-spacing:2px;fill:#e0c27a}.heading{font-size:25px;font-weight:700}.body{font-size:21px;fill:#bdb6ac}.note{font-size:17px;fill:#bdb6ac}.line{fill:none;stroke:#e0c27a;stroke-width:2}</style>

<text x="30" y="46" class="title">PRESERVE THE ERROR. HIDE THE IDENTITY.</text>
<text x="30" y="76" class="label">CAPTURE GUIDE · NOT A REAL LAUNCHER SCREENSHOT</text>
<rect x="30" y="110" width="415" height="260" fill="#11100e" stroke="#e0c27a"/>
<rect x="475" y="110" width="395" height="260" fill="#11100e" stroke="#e0c27a"/>
<text x="52" y="147" class="label">KEEP IN THE SUPPORT RECORD</text>
<rect x="52" y="170" width="371" height="67" fill="none" stroke="#e0c27a" stroke-dasharray="6 5"/>
<text x="70" y="198" class="body">Exact message or code</text>
<text x="70" y="224" class="note">Do not replace it with a guessed cause</text>
<text x="52" y="274" class="body">Failure stage and prior action</text>
<text x="52" y="311" class="body">Time / time zone / version</text>
<text x="52" y="346" class="note">Two times for stalled progress</text>
<text x="497" y="147" class="label">REDACT BEFORE PUBLICATION</text>
<text x="497" y="198" class="body">Name and email</text>
<text x="497" y="235" class="body">Passwords and auth codes</text>
<text x="497" y="272" class="body">Payment and ID documents</text>
<path d="M497 300H848M497 311H848M497 322H848" stroke="#e0c27a" stroke-width="5"/>
<text x="497" y="352" class="note">No account details pictured here</text>
<text x="450" y="409" text-anchor="middle" class="note">A capture template is not proof of a bug, successful payout or verified fix.</text>
</svg>
